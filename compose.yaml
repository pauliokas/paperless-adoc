services:
  redis:
    image: redis:7
    restart: unless-stopped

  paperless:
    container_name: paperless
    # Built from ./Dockerfile so the plugin is installed rather than mounted:
    # paperless-ngx v3 finds parsers through installed entry points, so a bind
    # mount would no longer register anything.
    build: .
    restart: unless-stopped
    depends_on:
      - redis
      - tika
      - gotenberg
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_TIME_ZONE: Europe/Vilnius
      PAPERLESS_SECRET_KEY: changeme
      PAPERLESS_TIKA_ENABLED: true
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    volumes:
      - ./consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"

  tika:
    image: apache/tika:3.2.3.0
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.23.2
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
