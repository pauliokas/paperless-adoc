[project]
name = "paperless-adoc"
version = "2.0.0"
description = "Paperless-ngx parser plugin for .adoc (Lithuanian signed document) containers"
readme = "README.md"
requires-python = ">=3.11"
# Intentionally empty: `documents.*` and `paperless.*` are provided by the
# paperless-ngx application at runtime. paperless-ngx is not on PyPI, so
# declaring it here would make `pip install paperless-adoc` clone the whole
# upstream repo into the image.
dependencies = []

# Paperless-ngx v3 discovers third-party parsers through this entrypoint group.
# See paperless/parsers/registry.py (ParserRegistry.discover) upstream.
[project.entry-points."paperless_ngx.parsers"]
adoc = "paperless_adoc.parsers:AdocDocumentParser"

[dependency-groups]
dev = [
    "paperless-ngx",
]

[tool.uv.sources]
paperless-ngx = { git = "https://github.com/paperless-ngx/paperless-ngx", tag = "v3.1.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperless_adoc"]

# Without an explicit include list the sdist sweeps in .direnv/ (a full venv,
# hundreds of MB), which matters because the container installs from a tarball.
[tool.hatch.build.targets.sdist]
# Patterns are gitignore-style and match at any depth unless anchored with a
# leading slash, so bare "README.md" would also pull in every nested README
# under .direnv/.
include = [
    "/paperless_adoc",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "/.direnv",
    "/.idea",
]
